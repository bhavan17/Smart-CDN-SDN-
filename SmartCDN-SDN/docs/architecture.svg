<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">SmartCDN-SDN architecture</title>
<desc id="desc">Ryu controller manages an Open vSwitch single-switch Mininet topology. Client h1 and h2 connect through the switch to CDN-A h3 or CDN-B h4. A health monitor probes backend health and reports to Ryu.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker>
  <style>
  .title{font:700 26px Arial,sans-serif;fill:#17202a}.label{font:700 18px Arial,sans-serif;fill:#17202a}.small{font:15px Arial,sans-serif;fill:#37474f}.box{stroke:#455a64;stroke-width:2;rx:14;ry:14}.link{stroke:#455a64;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}
  </style>
</defs>
<rect width="1100" height="650" fill="#ffffff"/>
<text x="550" y="42" text-anchor="middle" class="title">SmartCDN-SDN: Logical and Data-Plane Architecture</text>
<rect x="350" y="75" width="400" height="105" fill="#e8eaf6" class="box"/>
<text x="550" y="111" text-anchor="middle" class="label">Ryu SDN Controller</text>
<text x="550" y="139" text-anchor="middle" class="small">OpenFlow 1.3 · VIP selection · REST API</text>
<text x="550" y="160" text-anchor="middle" class="small">VIP: 10.0.0.100:8080</text>
<path d="M550 180 L550 240" class="link dash"/>
<text x="570" y="214" class="small">OpenFlow TCP :6653</text>
<rect x="370" y="245" width="360" height="95" fill="#e0f2f1" class="box"/>
<text x="550" y="282" text-anchor="middle" class="label">Open vSwitch s1</text>
<text x="550" y="310" text-anchor="middle" class="small">Single-switch Mininet topology</text>
<path d="M410 340 L170 430" class="link"/>
<path d="M470 340 L410 430" class="link"/>
<path d="M630 340 L690 430" class="link"/>
<path d="M690 340 L930 430" class="link"/>
<rect x="55" y="435" width="230" height="105" fill="#fff3e0" class="box"/>
<text x="170" y="475" text-anchor="middle" class="label">h1 · Client 1</text>
<text x="170" y="503" text-anchor="middle" class="small">10.0.0.1 · port 1</text>
<rect x="295" y="435" width="230" height="105" fill="#fff3e0" class="box"/>
<text x="410" y="475" text-anchor="middle" class="label">h2 · Client 2</text>
<text x="410" y="503" text-anchor="middle" class="small">10.0.0.2 · port 2</text>
<rect x="575" y="435" width="230" height="105" fill="#e8f5e9" class="box"/>
<text x="690" y="475" text-anchor="middle" class="label">h3 · CDN-A</text>
<text x="690" y="503" text-anchor="middle" class="small">10.0.0.3:8080 · port 3</text>
<rect x="815" y="435" width="230" height="105" fill="#e8f5e9" class="box"/>
<text x="930" y="475" text-anchor="middle" class="label">h4 · CDN-B</text>
<text x="930" y="503" text-anchor="middle" class="small">10.0.0.4:8080 · port 4</text>
<rect x="330" y="575" width="440" height="52" fill="#fce4ec" class="box"/>
<text x="550" y="598" text-anchor="middle" class="label">Health monitor</text>
<text x="550" y="617" text-anchor="middle" class="small">Probes /health from h1; reports backend state to Ryu</text>
<path d="M285 530 L360 575" class="link dash"/>
<text x="255" y="565" class="small">probes via h1 namespace</text>
</svg>
